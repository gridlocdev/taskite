appId: dev.gridloc.taskite
productName: Taskite
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # The window icon on Linux and Windows (macOS takes the bundle's icon.icns).
  - build/icon.png
asar: true
# Electron fuses, flipped in the packaged binary before it's signed: no running it as plain Node, no
# NODE_OPTIONS and no --inspect, so nobody can use the app's binary to run their own code; and the app's code
# only from the asar, checked against the hash in the binary; and file:// pages get no extra rights (pages come from app://).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
# One naming scheme on every system: Taskite-1.0.0-mac-arm64.dmg, Taskite-1.0.0-win-x64.exe, …
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target: [dmg, zip]
  hardenedRuntime: true
  # Ad-hoc signature, so Apple silicon will run a local build. Swap for a Developer ID to distribute.
  identity: '-'
linux:
  icon: build/icon.png
  target: [AppImage]
  # The package name (@taskite/desktop) isn't a usable file name.
  executableName: taskite
  category: Office
win:
  icon: build/icon.ico
  target: [nsis]
