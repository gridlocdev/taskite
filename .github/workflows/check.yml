name: check

# The same gate as `just check` (format, lint, typecheck, tests, build) on all three desktop systems.
# Run it by hand (Actions tab or `gh workflow run check.yml`), and on pull requests; never on push.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 caches pnpm's store by default, but pnpm only exists after `corepack enable`.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
